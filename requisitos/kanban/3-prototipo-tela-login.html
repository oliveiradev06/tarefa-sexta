<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Web — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="login-box">
    <h2>Bem-vindo</h2>
    <p class="subtitle">Acesse sua conta</p>

    <form id="loginForm">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seuemail@email.com" required>

      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required>

      <button type="submit">Entrar</button>
      <p id="mensagem"></p>
    </form>

    <a href="#" class="forgot">Esqueci minha senha</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
